# GradPilot API on Azure Container Apps.
# The Next.js app stays on Vercel and is intentionally not listed here.
name: gradpilot-ai
metadata:
  template: azd-init

services:
  api:
    project: ./apps/api
    language: python
    host: containerapp
    # path and context are relative to project. "." is apps/api at the repo root.
    docker:
      path: Dockerfile
      context: .
